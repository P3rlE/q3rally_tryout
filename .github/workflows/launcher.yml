name: Launcher
on:
  workflow_dispatch:
  push:
    branches: ['codex/launcher-*']
    paths: ['launcher/**', 'run_launcher.py', 'tools/*launcher*.py', 'tests/test_launcher*.py', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'run_launcher.py', 'tools/*launcher*.py', 'tests/test_launcher.py', '.github/workflows/launcher.yml']
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r launcher/requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -p test_launcher.py -v
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -p test_launcher_ui.py -v
        env:
          Q3RALLY_TEST_GUI: '1'
      - run: python tools/build_launcher.py --output output/launcher-ci
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ matrix.os }}
          path: |
            output/launcher-ci/*.zip
            output/launcher-ci/release.json
