name: Launcher Apple Silicon fallback
on:
  workflow_dispatch:
  push:
    branches: ['codex/launcher-*']
    paths: ['.github/workflows/launcher-arm.yml']
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Use static OpenSSL for Intel macOS cryptography builds
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: python -m pip install --no-cache-dir -r launcher/requirements.txt pyinstaller==6.22.3
      - name: Verify Intel cryptography has no dynamic OpenSSL dependency
        if: matrix.os == 'macos-15-intel'
        run: |
          python - <<'PY'
          import subprocess
          from cryptography.hazmat.bindings import _rust
          links = subprocess.check_output(['otool', '-L', _rust.__file__], text=True)
          print(links)
          assert 'libssl' not in links and 'libcrypto' not in links, 'cryptography must use static OpenSSL'
          PY
      - run: python -m unittest discover -s tests -p test_launcher.py -v
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -p test_launcher_ui.py -v
        env:
          Q3RALLY_TEST_GUI: '1'
      - run: python tools/build_launcher.py --output output/launcher-ci
      - if: runner.os != 'Linux'
        run: python tools/validate_launcher_package.py --release-index output/launcher-ci/release.json --output output/launcher-package-check
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tools/validate_launcher_package.py --release-index output/launcher-ci/release.json --output output/launcher-package-check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: launcher-${{ matrix.os }}
          path: |
            output/launcher-ci/*.zip
            output/launcher-ci/release.json
            output/launcher-package-check/result.json
            output/launcher-package-check/gui.log
            output/launcher-package-check/**/logs/*.log

